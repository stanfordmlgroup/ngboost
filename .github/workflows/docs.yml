name: Docs

# Builds the user guide in docs/ with Jupyter Book on every push and pull
# request. Pushes to master also deploy it to GitHub Pages. This needs
# Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install ngboost, Jupyter Book and the notebook packages
        run: pip install . -r docs/requirements.txt
      # The build runs the notebooks and shows the new outputs.
      # A cell that raises an error fails the build.
      - name: Build the site
        working-directory: docs
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter-book build --html --strict --ci --execute
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a deployment that has started finish. Queue the ones after it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
